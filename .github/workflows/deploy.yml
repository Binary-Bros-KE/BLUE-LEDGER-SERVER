name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # `set -e` is the actual fix here: without it, a failing step partway through this script
          # (git pull, migrate deploy, the build — any of them) did NOT stop the rest from running,
          # and the job still reported green as long as `pm2 restart` itself succeeded — twice, live,
          # on 2026-09-02: once a migration failed but the server still rebuilt and restarted against
          # a database that never actually got the migration, and separately git pull itself started
          # silently failing (no credentials) while the deploy "succeeded" against unchanged code both
          # times. `set -e` makes the very first failing command abort the script immediately with a
          # non-zero exit, which appleboy/ssh-action surfaces as a real, visibly failed job — the
          # deploy state now always matches what actually happened.
          script: |
            set -e
            cd ~/BLUE-LEDGER-SERVER
            git pull origin main
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart blueledger-server
            echo "Deploy completed successfully at $(date)"